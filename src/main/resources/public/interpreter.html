<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity360 - Interpreter</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
    <div class="wrap">
        <a class="wordmark" href="/">SmartCity<b>360</b></a>
        <span class="course">JIAT / OODP II</span>
    </div>
</header>

<main class="wrap">
    <a class="back" href="/">&larr; Back to dashboard</a>
    <div class="pagehead">
        <p class="kicker">Part E &middot; Interpreter</p>
        <h1>City policy interpreter</h1>
        <p class="lead">A rule that evaluates to <b>true</b> is a <b>violation</b>.
            Format: <code>variable operator value</code>, joined by AND / OR.</p>
    </div>

    <div class="stack">
        <section class="panel">
            <h2>Rules</h2>
            <div class="scroll"><table id="rules"></table></div>

            <h3>Add or update a rule</h3>
            <label for="rname">Rule name</label>
            <input id="rname" placeholder="e.g. NightNoise">
            <label for="rtext">Rule text</label>
            <input id="rtext" class="mono" placeholder="zone == HOME AND hour >= 22 AND noise_db > 60">
            <button class="block" onclick="saveRule()">Save rule</button>
            <p id="msg" class="msg"></p>
        </section>

        <section class="panel">
            <h2>Check an incident</h2>
            <div class="fields">
                <label>zone <input id="zone" value="HOME"></label>
                <label>hour <input id="hour" type="number" value="23"></label>
                <label>noise_db <input id="noise_db" type="number" value="65"></label>
                <label>parked_minutes <input id="parked_minutes" type="number" value="0"></label>
            </div>
            <button class="block" onclick="runCheck()">Evaluate</button>
            <div class="scroll" style="margin-top:16px"><table id="results"></table></div>
        </section>
    </div>
</main>

<script>
    const API = '/api/interpreter';
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const post = (url, body) => fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });

    async function loadRules() {
        const rules = await (await fetch(API + '/rules')).json();
        document.getElementById('rules').innerHTML = '<tr><th>Name</th><th>Rule</th><th></th></tr>' +
            rules.map(r => `<tr><td>${esc(r.name)}</td><td><code>${esc(r.text)}</code></td>
      <td><button class="danger sm" data-n="${esc(r.name)}" onclick="del(this.dataset.n)">Delete</button></td></tr>`).join('');
    }

    async function saveRule() {
        const res = await post(API + '/rules', { name: rname.value, text: rtext.value });
        const data = await res.json();
        msg.className = 'msg ' + (res.ok ? 'ok' : 'bad');
        msg.textContent = res.ok ? 'Rule saved.' : 'Error: ' + data.error;
        if (res.ok) loadRules();
    }

    async function del(name) {
        await fetch(API + '/rules/' + encodeURIComponent(name), { method: 'DELETE' });
        loadRules();
    }

    async function runCheck() {
        const context = { zone: zone.value, hour: Number(hour.value),
            noise_db: Number(noise_db.value), parked_minutes: Number(parked_minutes.value) };
        const rows = await (await post(API + '/evaluate', { context })).json();
        document.getElementById('results').innerHTML =
            '<tr><th>Rule</th><th>Result</th></tr>' + rows.map(r =>
                `<tr><td>${esc(r.name)}</td><td class="${r.violated || r.error ? 'bad' : 'ok'}">
     ${r.error ? esc(r.error) : r.violated ? 'VIOLATION' : 'OK'}</td></tr>`).join('');
    }
    loadRules();
</script>
</body>
</html>
