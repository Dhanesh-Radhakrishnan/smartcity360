<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity360 - Flyweight</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
    <div class="wrap">
        <a class="wordmark" href="/">SmartCity<b>360</b></a>
        <span class="course">JIAT / OODP II</span>
    </div>
</header>

<main class="wrap">
    <a class="back" href="/">&larr; Back to dashboard</a>
    <div class="pagehead">
        <p class="kicker">Part D &middot; Flyweight</p>
        <h1>Smart street lights</h1>
        <p class="lead">Every light keeps its own location. The model data is shared, so the type count stays tiny.</p>
    </div>

    <div class="stack">
        <section class="panel">
            <h2>Generate</h2>
            <label for="count">Number of lights</label>
            <div class="row">
                <input id="count" type="number" value="50000">
                <button onclick="generate()">Generate</button>
            </div>
        </section>

        <section class="panel">
            <h2>Memory</h2>
            <div id="stats"><p class="empty" style="margin:0">Click Generate.</p></div>
        </section>

        <section class="panel">
            <h2>First 10 lights</h2>
            <div class="scroll">
                <table>
                    <thead>
                    <tr><th>ID</th><th>Street</th><th>Location</th><th>Shared type</th><th>State</th><th>Power</th><th></th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<script>
    async function generate() {
        const count = document.getElementById('count').value;
        const res = await fetch('/api/flyweight/generate?count=' + count, { method: 'POST' });
        const s = await res.json();
        document.getElementById('stats').innerHTML =
            '<div class="figs">' +
            '<div class="fig"><b>' + s.totalLights + '</b><span>Street lights</span></div>' +
            '<div class="fig hl"><b>' + s.typeObjects + '</b><span>LightType objects in memory</span></div>' +
            '</div>';
        loadLights();
    }

    async function loadLights() {
        const res = await fetch('/api/flyweight/lights');
        const lights = await res.json();
        let html = '';
        for (const l of lights) {
            html += '<tr><td>' + l.id + '</td><td>' + l.street + '</td>' +
                '<td><code>' + l.lat.toFixed(4) + ', ' + l.lng.toFixed(4) + '</code></td><td>' + l.type.model + '</td>' +
                '<td class="' + (l.on ? 'ok' : 'empty') + '">' + (l.on ? 'ON' : 'off') + '</td><td>' + l.powerNow + ' W</td>' +
                '<td><button class="ghost sm" onclick="toggle(' + l.id + ')">Toggle</button></td></tr>';
        }
        document.getElementById('rows').innerHTML = html;
    }

    async function toggle(id) {
        await fetch('/api/flyweight/toggle/' + id, { method: 'POST' });
        loadLights();
    }
</script>
</body>
</html>
