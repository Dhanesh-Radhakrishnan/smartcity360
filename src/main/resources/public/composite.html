<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity360 - Zones</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
    <div class="wrap">
        <a class="wordmark" href="/">SmartCity<b>360</b></a>
        <span class="course">JIAT / OODP II</span>
    </div>
</header>

<main class="wrap">
    <a class="back" href="/">&larr; Back to dashboard</a>
    <div class="pagehead">
        <p class="kicker">Part B &middot; Composite</p>
        <h1>Smart zones</h1>
        <p class="lead">One command works at every level: city, district, street or building.</p>
    </div>

    <div class="stack">
        <section class="panel">
            <h2>Command</h2>
            <label for="zone">Zone name</label>
            <div class="row">
                <input id="zone" placeholder="Zone name" value="Kandy">
                <button onclick="run('GET', 'report')">Report usage</button>
                <button class="danger" onclick="run('POST', 'shutdown')">Shut down power</button>
                <button class="ghost" onclick="run('POST', 'restore')">Restore power</button>
            </div>
            <p class="hint">Try:
                <button class="link" onclick="pick('Kandy')">Kandy</button>,
                <button class="link" onclick="pick('Peradeniya')">Peradeniya</button>,
                <button class="link" onclick="pick('University Rd')">University Rd</button>,
                <button class="link" onclick="pick('Library')">Library</button>,
                <button class="link" onclick="pick('Hospital')">Hospital</button>
            </p>
        </section>

        <section class="panel">
            <h2>Output</h2>
            <pre class="out" id="out">Output appears here...</pre>
        </section>
    </div>
</main>

<script>
    function pick(name) { document.getElementById('zone').value = name; }

    async function run(method, action) {
        const name = document.getElementById('zone').value.trim();
        const res = await fetch('/api/composite/' + action + '/' + encodeURIComponent(name), { method });
        document.getElementById('out').textContent = await res.text();
    }
</script>
</body>
</html>
