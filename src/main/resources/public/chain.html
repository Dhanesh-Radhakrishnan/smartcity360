<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity360 – Complaint Escalation</title>
    <style>
        :root {
            --bg: #f3f5f4; --card: #ffffff; --ink: #1d2b27; --muted: #5d6d68;
            --line: #d5dedb; --accent: #0d6b5c; --low: #2e7d4f; --med: #b7791f;
            --high: #c05621; --crit: #b42318;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
        header { background: var(--accent); color: #fff; padding: 20px 24px; }
        header a { color: #fff; font-size: .9rem; opacity: .9; }
        header h1 { margin: 8px 0 0; font-size: 1.4rem; }
        header p { margin: 4px 0 0; opacity: .85; font-size: .95rem; }
        main { max-width: 1000px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; grid-template-columns: 340px 1fr; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
        h2 { margin: 0 0 14px; font-size: 1.1rem; }
        label { display: block; font-size: .9rem; margin: 12px 0 4px; color: var(--muted); }
        input, textarea, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
        textarea { min-height: 90px; resize: vertical; }
        :focus-visible { outline: 3px solid #7ac1b4; outline-offset: 1px; }
        button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #0a5649; }
        .msg { margin-top: 10px; font-size: .9rem; color: var(--crit); min-height: 1.2em; }
        .empty { color: var(--muted); }
        .item { border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin-bottom: 14px; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .badge { font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; color: #fff; }
        .LOW { background: var(--low); } .MEDIUM { background: var(--med); }
        .HIGH { background: var(--high); } .CRITICAL { background: var(--crit); }
        .meta { color: var(--muted); font-size: .88rem; margin: 6px 0; }
        .status { font-weight: 600; }
        ol.trail { margin: 10px 0 0; padding-left: 20px; font-size: .86rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
        ol.trail li { margin: 3px 0; }
    </style>
</head>
<body>
<header>
    <a href="index.html">&larr; Back to dashboard</a>
    <h1>Complaint Escalation</h1>
    <p>Chain of Responsibility: Local Staff, then Supervisor, then City Manager</p>
</header>

<main>
    <section>
        <h2>Submit a complaint</h2>
        <label for="name">Your name</label>
        <input id="name" placeholder="e.g. Nimal Perera">

        <label for="desc">What happened?</label>
        <textarea id="desc" placeholder="e.g. Street light is flickering on Peradeniya Road"></textarea>

        <label for="sev">Severity</label>
        <select id="sev">
            <option value="LOW">Low – minor issue</option>
            <option value="MEDIUM">Medium – needs attention</option>
            <option value="HIGH">High – serious problem</option>
            <option value="CRITICAL">Critical – emergency</option>
        </select>

        <button id="send">Submit complaint</button>
        <div class="msg" id="msg" role="alert"></div>
    </section>

    <section>
        <h2>Complaints and escalation trail</h2>
        <div id="list"><p class="empty">No complaints yet. Submit one to see how it escalates.</p></div>
    </section>
</main>

<script>
    const API = "/api/chain/complaints";
    const $ = id => document.getElementById(id);

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function render(items) {
        const list = $("list");
        list.replaceChildren();
        if (!items.length) {
            list.appendChild(el("p", "empty", "No complaints yet. Submit one to see how it escalates."));
            return;
        }
        items.forEach(c => {
            const box = el("div", "item");
            const top = el("div", "top");
            top.appendChild(el("strong", "", "#" + c.id + " – " + c.citizenName));
            top.appendChild(el("span", "badge " + c.severity, c.severity));
            box.appendChild(top);
            box.appendChild(el("div", "", c.description));
            const meta = el("div", "meta");
            meta.appendChild(el("span", "status", c.status));
            meta.appendChild(document.createTextNode(c.resolvedBy ? " by " + c.resolvedBy : ""));
            box.appendChild(meta);
            const ol = el("ol", "trail");
            c.trail.forEach(t => ol.appendChild(el("li", "", t)));
            box.appendChild(ol);
            list.appendChild(box);
        });
    }

    async function load() {
        const res = await fetch(API);
        render(await res.json());
    }

    $("send").addEventListener("click", async () => {
        $("msg").textContent = "";
        const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                citizenName: $("name").value,
                description: $("desc").value,
                severity: $("sev").value
            })
        });
        if (!res.ok) {
            const err = await res.json();
            $("msg").textContent = err.error || "Something went wrong.";
            return;
        }
        $("desc").value = "";
        load();
    });

    load();
</script>
</body>
</html>
